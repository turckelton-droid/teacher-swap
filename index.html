<script id="parser">
// ===== aSc / Oman XML parser (works on raw bytes; detects windows-1256) =====
function decodeXmlBytes(buf){
  const head = new TextDecoder('latin1').decode(buf.slice(0, 200));
  const m = head.match(/encoding="([^"]+)"/i);
  let enc = (m ? m[1] : 'utf-8').toLowerCase();
  try { return new TextDecoder(enc).decode(buf); } catch(e){ return new TextDecoder('utf-8').decode(buf); }
}
function parseTimetable(text){
  const ent = s => s.replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
  const tags = name => {
    const out = [], re = new RegExp('<' + name + '\\s([^>]*?)/?>', 'g'); let m;
    while ((m = re.exec(text))) { const o = {}, ar = /([\w:]+)="([^"]*)"/g; let a;
      while ((a = ar.exec(m[1]))) o[a[1]] = ent(a[2]); out.push(o); }
    return out;
  };
  const days = tags('day').map(d => ({day: +d.day, name: d.name || d.short}));
  const periods = tags('period').map(p => ({period: +p.period, start: p.starttime, end: p.endtime}));
  const teachers = tags('teacher').map(t => ({id: t.id, name: t.name || t.short, short: t.short, gender: t.gender}));
  const subjects = tags('subject').map(s => ({id: s.id, name: s.name || s.short}));
  const rooms = {}; tags('classroom').forEach(r => rooms[r.id] = r.name);
  const rawClasses = tags('class').map(c => ({id: c.id, name: c.name}));
  let rows = tags('TimeTableSchedule').map(r => [+r.DayID, +r.Period, r.TeacherID, r.ClassID, r.SubjectGradeID, rooms[r.SchoolRoomID] || '']);
  if (!rows.length) rows = tags('card').map(r => [+r.day, +r.period, r.teacherid, (r.classids||'').split(',')[0], r.subjectid, rooms[r.classroomid] || '']);
  const seen = new Set();
  rows = rows.filter(r => { if (!r[0] || !r[1] || !r[2] || !r[3]) return false; const k = r.slice(0,4).join('|'); if (seen.has(k)) return false; seen.add(k); return true; });
  // class display name: most common "N/M" room used by that class, else cleaned name
  const roomCount = {};
  rows.forEach(r => { if (/^\d+\s*\/\s*\d+$/.test(r[5])) { const c = roomCount[r[3]] = roomCount[r[3]] || {}; c[r[5]] = (c[r[5]]||0) + 1; } });
  const classes = rawClasses.map(c => {
    const rc = roomCount[c.id]; let nm = (c.name || '').replace(/\s+/g,'');
    if (rc) nm = Object.entries(rc).sort((a,b) => b[1]-a[1])[0][0].replace(/\s+/g,'');
    return {id: c.id, name: nm};
  });
  const tset = new Set(rows.map(r => r[2]));
  return {days, periods, subjects, classes, teachers: teachers.filter(t => tset.has(t.id)), schedule: rows};
}
if (typeof module !== 'undefined') module.exports = {decodeXmlBytes, parseTimetable};
</script>

<script>
// ===== Matching logic (pure; testable) =====
const SCHOOL_DOW = {0:1,1:2,2:3,3:4,4:5}; // Sun..Thu -> day 1..5
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseIso(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function dayOf(dateStr){ const v = SCHOOL_DOW[parseIso(dateStr).getDay()]; return v || null; }
function addDays(dateStr, n){ const d = parseIso(dateStr); d.setDate(d.getDate()+n); return iso(d); }
function schoolDates(fromStr, n){ const out = []; let s = fromStr; while (out.length < n){ if (dayOf(s)) out.push(s); s = addDays(s,1); } return out; }

function buildIndex(B){
  const busy = new Set(), byTeacher = {}, classTeachers = {}, slotsOf = {};
  B.schedule.forEach(([d,p,t,c,s]) => {
    busy.add(t+'|'+d+'|'+p);
    (byTeacher[t] = byTeacher[t] || []).push({d,p,c,s});
    (classTeachers[c] = classTeachers[c] || new Set()).add(t);
    (slotsOf[c] = slotsOf[c] || []).push({d,p,t,s});
  });
  const appt = new Set(), behind = {};
  B.flags.forEach(f => {
    if (f.kind === 'appointment' && f.on_date) (f.periods||[]).forEach(p => appt.add(f.teacher_id+'|'+f.on_date+'|'+p));
    if (f.kind === 'behind' && f.class_id) (behind[f.teacher_id] = behind[f.teacher_id] || new Set()).add(f.class_id);
  });
  const covering = new Set(), slotReq = {};
  (B.requests||[]).forEach(r => {
    if (r.status === 'accepted' && r.by) covering.add(r.by+'|'+r.date+'|'+r.p);
    if (r.status === 'pending' || r.status === 'accepted') slotReq[r.from+'|'+r.date+'|'+r.p] = r;
  });
  const T = {}; B.teachers.forEach(t => T[t.id] = t);
  const C = {}; B.classes.forEach(c => C[c.id] = c.name);
  const S = {}; B.subjects.forEach(s => S[s.id] = s.name);
  const P = {}; B.periods.forEach(p => P[p.period] = p);
  const D = {}; B.days.forEach(d => D[d.day] = d.name);
  const loadOn = (t,d) => (byTeacher[t]||[]).filter(x => x.d === d).length;
  const isFree = (t,d,p,date) => !busy.has(t+'|'+d+'|'+p) && !(date && (appt.has(t+'|'+date+'|'+p) || covering.has(t+'|'+date+'|'+p)));
  return {busy, byTeacher, classTeachers, slotsOf, appt, behind, covering, slotReq, T, C, S, P, D, loadOn, isFree};
}

function coverCandidates(I, me, date, p, cls){
  const d = dayOf(date), out = [];
  Object.keys(I.T).forEach(t => {
    if (t === me || !I.isFree(t,d,p,date)) return;
    const isBehind = I.behind[t] && I.behind[t].has(cls);
    const teaches = I.classTeachers[cls] && I.classTeachers[cls].has(t);
    if (!(I.byTeacher[t]||[]).length) return;
    out.push({t, isBehind, teaches, load: I.loadOn(t,d), rank: isBehind ? 0 : teaches ? 1 : 2});
  });
  return out.sort((a,b) => a.rank - b.rank || a.load - b.load);
}

function swapCandidates(I, me, date, p, cls, today){
  const d = dayOf(date), out = [];
  const weekStart = addDays(date, -(d-1));
  (I.slotsOf[cls]||[]).forEach(s => {
    if (s.t === me || (s.d === d && s.p === p)) return;
    let date2 = addDays(weekStart, s.d-1);
    if (date2 < today) date2 = addDays(date2, 7);
    if (date2 === date && s.p === p) return;
    if (!I.isFree(s.t, d, p, date)) return;              // B free at my slot
    if (!I.isFree(me, s.d, s.p, date2)) return;           // me free at B's slot
    if (I.appt.has(s.t+'|'+date2+'|'+s.p)) return;        // B has appointment then anyway
    const dist = Math.abs(parseIso(date2) - parseIso(date)) / 864e5;
    out.push({t: s.t, d2: s.d, p2: s.p, date2, subj: s.s, dist, isBehind: !!(I.behind[s.t] && I.behind[s.t].has(cls))});
  });
  return out.sort((a,b) => a.dist - b.dist || a.p2 - b.p2);
}

function opportunities(I, B, me, today){
  const out = [];
  B.flags.forEach(f => {
    if (f.kind !== 'appointment' || f.teacher_id === me || !f.on_date || f.on_date < today) return;
    const d = dayOf(f.on_date); if (!d) return;
    (f.periods||[]).forEach(p => {
      const les = (I.byTeacher[f.teacher_id]||[]).find(x => x.d === d && x.p === p);
      if (!les || !I.isFree(me, d, p, f.on_date)) return;
      const teaches = !!(I.classTeachers[les.c] && I.classTeachers[les.c].has(me));
      const meBehind = !!(I.behind[me] && I.behind[me].has(les.c));
      out.push({flag: f, owner: f.teacher_id, date: f.on_date, d, p, c: les.c, s: les.s, teaches, meBehind});
    });
  });
  return out.sort((a,b) => (b.meBehind - a.meBehind) || (b.teaches - a.teaches) || (a.date < b.date ? -1 : a.date > b.date ? 1 : a.p - b.p));
}
if (typeof module !== 'undefined') module.exports = Object.assign(module.exports || {}, {buildIndex, coverCandidates, swapCandidates, opportunities, schoolDates, dayOf, iso});
</script>

function started(date, p){ const t = String(pTime(p)||'7:00').split(':').map(Number), d = parseIso(date); d.setHours(t[0]||0, t[1]||0, 0, 0); return d <= new Date(); }
const ORD = ['','الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة'];
function pLabel(p){ const t = pTime(p), h = +String(t).split(':')[0]; return (ORD[p] || p) + (t ? ` (${t} ${h && h < 12 ? 'صباحًا' : 'ظهرًا'})` : ''); }
function slotLines(date, p, cls){ return `📅 اليوم: ${dayName(dayOf(date))} ${fmtDate(date)}\n⏰ الحصة: ${pLabel(p)}\n🏫 الصف: ${cls}`; }
function reqLines(r){ return slotLines(r.date, r.p, S.I.C[r.c] || r.c); }
// o: {intro, rows, link (true | نص), outro, sign}
function waMsg(to, o){
  const lk = o.link === true ? `أرسلت لك الطلب في «بديل»: ${APP_URL}` : o.link ? `${o.link} ${APP_URL}` : '';
  return [`السلام عليكم ورحمة الله وبركاته،`, `أ.${first(tName(to))}، عساك بخير.`, o.intro, o.rows, lk, o.outro, o.sign === false ? '' : first(tName(S.bundle.me))].filter(Boolean).join('\n') + (o.sign === false ? '\n' : '');
}
const THANKS = 'شاكر لك تعاونك، وجزاك الله خيرًا.';
function reqs(){ return (S.bundle && S.bundle.requests) || []; }
function incoming(){ const me = S.bundle.me; return reqs().filter(r => r.status === 'pending' && !started(r.date, r.p) && r.to.some(x => x.t === me && x.r === 'pending')); }
function reqWhen(r){ return `${dayName(dayOf(r.date))} ${fmtDate(r.date)} الحصة ${r.p}`; }
function waBtn(t, msg, label){ const l = waLink(t, msg); return l ? `<a class="btn wa sm" href="${l}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">${label||'واتساب'}</a>` : ''; }

async function refresh(silent){
  try {
    const old = S.bundle, args = {p_token: S.token};
    if (old && old.tt_ver != null && old.schedule) args.p_ver = old.tt_ver;
    let b = await rpc('get_bundle', args);
    if (b.same) { const {same, ...rest} = b; b = {...old, ...rest}; }
    S.bundle = b; store.set('ts_bundle', b); S.I = buildIndex(b);
  } catch(e){
    if (e.code === 'no_session'){ logout(); return; }
    if (!silent) toast('لا يوجد اتصال، تُعرض آخر نسخة محفوظة');
  }
}
function logout(){ S.token = null; S.bundle = null; S.I = null; store.del('ts_token'); store.del('ts_bundle'); renderLogin(); }

// ---------- Login ----------
let LOGIN = {list: [], pick: null, mode: 'list', pin: '', pin2: '', phone: ''};
async function renderLogin(){
  document.body.style.paddingBottom = '16px';
  $('#app').innerHTML = `<div class="wrap"><header class="top"><h1>بديل</h1><div class="sub">تبديل الحصص وتأمينها بسهولة</div></header><div id="lg"></div></div>`;
  if (!LOGIN.list.length){
    $('#lg').innerHTML = '<div class="empty">جاري التحميل…</div>';
    try { LOGIN.list = await rpc('list_teachers'); } catch(e){ $('#lg').innerHTML = '<div class="empty">لا يوجد اتصال بالإنترنت</div>'; return; }
  }
  drawLogin();
}
function drawLogin(){
  const L = LOGIN, el = $('#lg');
  if (L.mode === 'list'){
    if (!L.list.length){ el.innerHTML = `<div class="empty">لم يُرفع الجدول بعد. يُرجى من المشرف رفع ملف الجدول أولًا.</div><div style="text-align:center"><button class="linkbtn" id="adm">دخول المشرف</button></div>`; $('#adm').onclick = () => { L.mode='admin'; L.pin=''; drawLogin(); }; return; }
    el.innerHTML = `<label class="l">اختر اسمك</label><input class="f" id="q" placeholder="ابحث بالاسم…" autocomplete="off">
      <div class="card list" id="names" style="margin-top:10px;max-height:60vh;overflow:auto"></div>
      <div style="text-align:center;margin-top:10px"><button class="linkbtn" id="adm">دخول المشرف</button></div>`;
    const draw = q => { const rows = L.list.filter(t => !q || norm(t.name).includes(norm(q))).slice(0, 80);
      $('#names').innerHTML = rows.map(t => `<div class="it" data-id="${esc(t.id)}"><span>${esc(t.name)}</span>${t.has_pin ? '' : '<span class="tag">جديد</span>'}</div>`).join('') || '<div class="empty">لا يوجد اسم مطابق</div>'; };
    draw(''); $('#q').oninput = e => draw(e.target.value.trim());
    $('#names').onclick = e => { const it = e.target.closest('.it'); if (!it) return; L.pick = L.list.find(t => t.id === it.dataset.id); L.mode = L.pick.has_pin ? 'pin' : 'setup'; L.pin=''; L.pin2=''; drawLogin(); };
    $('#adm').onclick = () => { L.mode='admin'; L.pin=''; drawLogin(); };
    return;
  }
  if (L.mode === 'pin' || L.mode === 'admin'){
    const isAdm = L.mode === 'admin', len = isAdm ? 6 : 4;
    el.innerHTML = `<div class="card sec" style="text-align:center"><div style="font-weight:600">${isAdm ? 'رمز المشرف' : esc(L.pick.name)}</div>
      <div class="muted small">${isAdm ? '6 أرقام' : 'أدخل رمزك السري'}</div>
      <div class="pin">${Array.from({length: len}, (_, i) => `<span class="${i < L.pin.length ? 'on' : ''}"></span>`).join('')}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}">${k}</button>`).join('')}</div>
      <div class="err" id="er"></div><button class="linkbtn" id="back">رجوع</button></div>`;
    $('#back').onclick = () => { L.mode='list'; drawLogin(); };
    el.querySelector('.pad').onclick = async e => {
      const k = e.target.dataset && e.target.dataset.k; if (k === undefined) return;
      if (k === '⌫') L.pin = L.pin.slice(0,-1); else if (L.pin.length < len) L.pin += k;
      el.querySelectorAll('.pin span').forEach((s,i) => s.classList.toggle('on', i < L.pin.length));
      if (L.pin.length === len){
        try {
          const tok = isAdm ? await rpc('admin_login', {p_code: L.pin}) : await rpc('login', {p_teacher: L.pick.id, p_pin: L.pin});
          if (!tok){ $('#er').textContent = 'الرمز غير صحيح'; L.pin=''; el.querySelectorAll('.pin span').forEach(s => s.classList.remove('on')); return; }
          await enter(tok);
        } catch(err){ $('#er').textContent = err.message; L.pin=''; el.querySelectorAll('.pin span').forEach(s => s.classList.remove('on')); }
      }
    };
    return;
  }
  if (L.mode === 'setup'){
    el.innerHTML = `<div class="card sec"><div style="font-weight:600">${esc(L.pick.name)}</div><div class="muted small">الدخول الأول: أنشئ رمزًا سريًا، وأضف رقم الواتساب ليتواصل معك زملاؤك.</div>
      <label class="l">الرمز السري (4 أرقام)</label><input class="f" id="p1" inputmode="numeric" maxlength="4" type="password" autocomplete="new-password">
      <label class="l">أكّد الرمز</label><input class="f" id="p2" inputmode="numeric" maxlength="4" type="password" autocomplete="new-password">
      <label class="l">رقم الواتساب</label><input class="f" id="ph" inputmode="tel" placeholder="مثال: 9xxxxxxx" dir="ltr">
      <div class="err" id="er"></div><button class="btn block" id="go">تفعيل</button>
      <div style="text-align:center"><button class="linkbtn" id="back">رجوع</button></div></div>`;
    $('#back').onclick = () => { L.mode='list'; drawLogin(); };
    $('#go').onclick = async () => {
      const a = $('#p1').value, b = $('#p2').value;
      if (!/^\d{4}$/.test(a)) return $('#er').textContent = ERR.pin_format;
      if (a !== b) return $('#er').textContent = 'الرمزان غير متطابقين';
      try { const tok = await rpc('setup_account', {p_teacher: L.pick.id, p_pin: a, p_phone: $('#ph').value}); await enter(tok); }
      catch(err){ $('#er').textContent = err.message; }
    };
  }
}
async function enter(tok){ S.token = tok; store.set('ts_token', tok); LOGIN.mode = 'list'; LOGIN.pin = ''; await refresh(); if (S.bundle) route(); }

// ---------- Main ----------
function route(){
  if (!S.token || !S.bundle){ renderLogin(); return; }
  S.I = S.I || buildIndex(S.bundle);
  if (S.bundle.is_admin) return renderAdmin();
  document.body.style.paddingBottom = '';
  if (!S.date || S.date < today() || !dayOf(S.date)) S.date = schoolDates(today(), 1)[0];
  const opp = opportunities(S.I, S.bundle, S.bundle.me, today()).length, inc = incoming().length;
  const me = S.I.T[S.bundle.me];
  $('#app').innerHTML = `<div class="wrap"><header class="top"><h1>${esc(me ? first(me.name) : '')}</h1><div class="sub" id="sub"></div></header><main id="main"></main></div>
  <nav class="tabs">
    <button data-t="day" class="${S.tab==='day'?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>حصصي</button>
    <button data-t="req" class="${S.tab==='req'?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H8l-4 4z"/></svg><span>طلباتي${inc ? `<span class="badge">${inc}</span>` : ''}</span></button>
    <button data-t="opp" class="${S.tab==='opp'?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></svg><span>مواعيد الزملاء${opp ? `<span class="badge">${opp}</span>` : ''}</span></button>
    <button data-t="me" class="${S.tab==='me'?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>حالتي</button>
  </nav>`;
  document.querySelector('nav.tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.t; route(); };
  ({day: renderDay, req: renderReq, opp: renderOpp, me: renderMe})[S.tab]();
}

function renderDay(){
  const I = S.I, me = S.bundle.me, dates = schoolDates(today(), 10), d = dayOf(S.date);
  $('#sub').textContent = 'اختر اليوم، ثم اضغط على الحصة المطلوب تبديلها أو تأمينها';
  const mine = (I.byTeacher[me]||[]).filter(x => x.d === d);
  const myAppts = new Set(S.bundle.flags.filter(f => f.kind==='appointment' && f.teacher_id===me && f.on_date===S.date).flatMap(f => f.periods||[]));
  const per = S.bundle.periods.length ? S.bundle.periods.map(p => p.period) : [1,2,3,4,5,6,7];
  $('#main').innerHTML = `<div class="chips">${dates.map(x => `<button class="chip ${x===S.date?'on':''}" data-d="${x}">${esc(dayName(dayOf(x)))}<span class="d">${x===today()?'اليوم':fmtDate(x)}</span></button>`).join('')}</div>
    <div id="slots">${per.map(p => { const l = mine.find(x => x.p === p);
      if (!l){
        const cv = reqs().find(r => r.status === 'accepted' && r.by === me && r.date === S.date && r.p === p);
        if (cv) return `<div class="card slot mine" data-r="${cv.id}"><div class="n">${p}</div><div class="b"><div class="t">${esc(I.C[cv.c]||cv.c)} <span class="tag o">تؤمّنها</span></div><div class="muted small">عن أ. ${esc(first(tName(cv.from)))} · ${esc(pTime(p))}</div></div></div>`;
        return `<div class="slot free"><div class="n">${p}</div><div class="b small">فراغ${pTime(p)?' · '+esc(pTime(p)):''}</div></div>`;
      }
      const rq = I.slotReq[me+'|'+S.date+'|'+p];
      const rtag = !rq ? '' : rq.status === 'accepted' ? `<span class="tag o">${KIND[rq.kind]}: أ. ${esc(first(tName(rq.by)))}</span>` : '<span class="tag w">طلب بانتظار الرد</span>';
      return `<div class="card slot" data-p="${p}"><div class="n">${p}</div><div class="b"><div class="t">${esc(I.C[l.c]||l.c)} ${myAppts.has(p)?'<span class="tag w">لديك موعد</span>':''}${rtag}</div>
        <div class="muted small">${esc(I.S[l.s]||'')} · ${esc(pTime(p))}</div></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)"><path d="M15 6l-6 6 6 6"/></svg></div>`; }).join('')}
    ${mine.length ? '' : '<div class="empty">لا توجد حصص في هذا اليوم</div>'}</div>`;
  $('#main').querySelector('.chips').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; S.date = c.dataset.d; renderDay(); };
  $('#slots').onclick = e => { const r = e.target.closest('.slot[data-r]'); if (r){ S.tab = 'req'; route(); return; } const s = e.target.closest('.slot[data-p]'); if (s) openSlot(+s.dataset.p); };
  const on = $('#main').querySelector('.chip.on'); on && on.scrollIntoView({inline:'center', block:'nearest'});
}

function openSheet(html){ $('#sheetBody').innerHTML = html; $('#sheetBg').style.display = 'block'; requestAnimationFrame(() => $('#sheet').classList.add('open')); }
function closeSheet(){ $('#sheet').classList.remove('open'); $('#sheetBg').style.display = 'none'; }
$('#sheetBg').onclick = closeSheet;

function candCard(t, why, msg, tags, sel){
  const link = waLink(t, msg);
  const selBtn = sel ? `<button class="btn ghost sm selbtn ${sel.on?'on':''}" data-sel="${esc(t)}">${sel.on ? '✓ مختار' : 'اختيار'}</button>` : '';
  return `<div class="card cand"><div class="row"><div class="nm">${esc(tName(t))}</div>${tags||''}</div><div class="why">${why}</div>
    <div class="acts">${selBtn}${link ? `<a class="btn wa sm" href="${link}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">واتساب</a>` : `<button class="btn sm ghost" disabled>لا يوجد رقم</button>`}
    ${sel ? '' : `<button class="btn ghost sm" data-copy="${esc(msg)}">نسخ الرسالة</button>`}</div></div>`;
}

let PICK = new Set();
function openSlot(p, mode, keep){
  const I = S.I, me = S.bundle.me, date = S.date, d = dayOf(date);
  const l = (I.byTeacher[me]||[]).find(x => x.d === d && x.p === p); if (!l) return;
  mode = mode || 'cover'; if (!keep) PICK = new Set();
  const cls = I.C[l.c] || l.c, myName = first(tName(me));
  const when = `${dayName(d)} ${fmtDate(date)} الحصة ${p}`;
  const head = `<div style="font-weight:700;font-size:17px">${esc(cls)} · ${esc(I.S[l.s]||'')}</div><div class="muted small">${esc(when)}${pTime(p)?' · '+esc(pTime(p)):''}</div>`;
  const rq = I.slotReq[me+'|'+date+'|'+p];
  if (rq) return openReqStatus(rq, head);
  const late = started(date, p);
  let body = '', msgs = {};
  if (mode === 'cover'){
    const list = coverCandidates(I, me, date, p, l.c);
    body = list.length ? list.slice(0, 25).map(x => {
      const tags = (x.isBehind ? '<span class="tag w">متأخر مع الصف</span>' : '') + (x.teaches && !x.isBehind ? '<span class="tag o">يدرّس الصف</span>' : '');
      const msg = msgs[x.t] = waMsg(x.t, {intro: 'أرجو منك التكرم بتأمين الحصة التالية:', rows: slotLines(date, p, cls), link: true, outro: THANKS});
      return candCard(x.t, `متفرغ في هذا الوقت · لديه ${x.load} حصص في اليوم`, msg, tags, late ? null : {on: PICK.has(x.t)});
    }).join('') : '<div class="empty">لا يوجد معلم متفرغ في هذه الحصة</div>';
  } else {
    const list = swapCandidates(I, me, date, p, l.c, today()), seen = new Set();
    body = list.length ? list.slice(0, 25).map(x => {
      const w2 = `${dayName(x.d2)} ${fmtDate(x.date2)} الحصة ${x.p2}`;
      const msg = waMsg(x.t, {intro: 'أرجو منك التكرم بتبديل الحصة التالية معي:', rows: slotLines(date, p, cls) + `\n🔁 وآخذ حصتك مع الصف نفسه: ${dayName(x.d2)} ${fmtDate(x.date2)}، الحصة ${pLabel(x.p2)}`, link: true, outro: THANKS});
      if (!msgs[x.t]) msgs[x.t] = msg;
      const canSel = !late && !seen.has(x.t); seen.add(x.t);
      return candCard(x.t, `يأخذ حصتك، وتأخذ حصته <b>${esc(w2)}</b> (${esc(I.S[x.subj]||'')})`, msg, x.isBehind ? '<span class="tag w">متأخر مع الصف</span>' : '', canSel ? {on: PICK.has(x.t)} : null);
    }).join('') : '<div class="empty">لا يوجد تبديل مناسب مع الصف نفسه في هذا الأسبوع</div>';
  }
  openSheet(`${head}
    <div class="seg"><button data-m="cover" class="${mode==='cover'?'on':''}">تأمين</button><button data-m="swap" class="${mode==='swap'?'on':''}">تبديل</button></div>
    <div class="muted small" style="margin-bottom:4px">${mode==='cover' ? 'زميل متفرغ يؤمّن الحصة مكانك. يظهر أولًا المتأخرون في المنهج ومن يدرّسون الصف.' : 'زميل يدرّس الصف نفسه، فتتبادلان الحصتين. تتفقان لاحقًا على موعد ردّ الحصة.'}
    ${late ? '' : '<br>اختر زميلًا أو أكثر وأرسل الطلب؛ أول من يقبل تُسجَّل الحصة باسمه.'}</div>
    <div id="cands">${body}</div>
    ${late ? '' : `<div class="sendbar"><button class="btn block" id="send" ${PICK.size?'':'disabled'}>أرسل الطلب${PICK.size ? ' إلى ' + PICK.size : ''}</button></div>`}
    <button class="btn ghost block" id="mkappt" style="margin-top:8px">سجّل أن لديّ موعدًا في هذه الحصة</button>`);
  $('#sheetBody').querySelector('.seg').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.m !== mode) openSlot(p, b.dataset.m); };
  $('#cands').onclick = e => {
    const c = e.target.closest('[data-copy]'); if (c) return copy(c.dataset.copy);
    const s = e.target.closest('[data-sel]'); if (!s) return;
    const t = s.dataset.sel; PICK.has(t) ? PICK.delete(t) : PICK.add(t);
    const sc = $('#sheet').scrollTop; openSlot(p, mode, true); $('#sheet').scrollTop = sc;
  };
  const sb = $('#send'); if (sb) sb.onclick = async () => {
    if (!PICK.size) return; sb.disabled = true;
    const to = [...PICK];
    try {
      await rpc('create_request', {p_token: S.token, p_kind: mode, p_date: date, p_period: p, p_targets: to, p_note: null});
      await refresh(true);
      openSheet(`${head}<div class="empty" style="padding:16px 0 8px"><b>تم إرسال الطلب ✓</b><br>سيظهر لزملائك في «طلباتي». نبّههم عبر الواتساب:</div>
        ${to.map(t => `<div class="card cand"><div class="row"><div class="nm">${esc(tName(t))}</div>${waBtn(t, msgs[t]) || '<span class="muted small">لا يوجد رقم</span>'}</div></div>`).join('')}
        <button class="btn ghost block" id="done" style="margin-top:10px">تم</button>`);
      $('#done').onclick = () => { closeSheet(); route(); };
    } catch(err){ toast(err.message); sb.disabled = false; }
  };
  $('#mkappt').onclick = async () => {
    try { await rpc('add_flag', {p_token: S.token, p_kind:'appointment', p_class:null, p_date: date, p_periods:[p], p_note:null}); await refresh(true); toast('تم التسجيل، وسيظهر لزملائك في «مواعيد الزملاء»'); closeSheet(); route(); }
    catch(err){ toast(err.message); }
  };
}

function openReqStatus(r, head){
  const me = S.bundle.me, cls = S.I.C[r.c] || r.c;
  let html = head;
  if (r.status === 'accepted'){
    const msg = waMsg(r.by, {intro: `أعتذر منك، فقد ألغيت طلب ${KIND[r.kind]} الحصة التالية:`, rows: reqLines(r), outro: THANKS});
    html += `<div class="card cand" style="margin-top:12px"><div class="row"><div class="nm">${esc(tName(r.by))}</div><span class="tag o">قَبِل ${KIND[r.kind]}</span></div>
      <div class="why">${r.kind === 'swap' ? 'تتفقان على موعد ردّ الحصة.' : 'سيؤمّن الحصة مكانك.'}</div>
      <div class="acts">${waBtn(r.by, waMsg(r.by, {intro: `شكرًا لقبولك ${KIND[r.kind]} الحصة التالية:`, rows: reqLines(r), outro: 'جزاك الله خيرًا.'}))}</div></div>
      <button class="btn ghost block" id="cx" style="margin-top:10px">إلغاء</button>`;
    openSheet(html);
    $('#cx').onclick = () => cancelReq(r, r.by, msg);
  } else {
    const dec = r.to.filter(x => x.r === 'declined').length;
    html += `<div class="card cand" style="margin-top:12px"><div class="row"><div class="nm">طلب ${KIND[r.kind]} بانتظار الرد</div><span class="tag w">${r.to.length - dec} من ${r.to.length}</span></div>
      <div class="why">${r.to.map(x => esc(first(tName(x.t))) + (x.r === 'declined' ? ' (اعتذر)' : '')).join('، ')}</div></div>
      <button class="btn ghost block" id="cx" style="margin-top:10px">سحب الطلب</button>`;
    openSheet(html);
    $('#cx').onclick = () => cancelReq(r);
  }
}

async function cancelReq(r, other, msg){
  if (!confirm(r.status === 'accepted' ? 'هل تريد إلغاء هذا الاتفاق؟ سيظهر للطرف الآخر أنه أُلغي.' : 'هل تريد سحب الطلب؟')) return;
  try {
    await rpc('cancel_request', {p_token: S.token, p_id: r.id}); await refresh(true);
    const wa = other && msg ? waBtn(other, msg, 'أبلغه عبر الواتساب') : '';
    if (wa){ openSheet(`<div class="empty" style="padding:16px 0 8px"><b>تم الإلغاء</b></div>${wa.replace('btn wa sm','btn wa block')}<button class="btn ghost block" id="done" style="margin-top:10px">تم</button>`); $('#done').onclick = () => { closeSheet(); route(); }; }
    else { closeSheet(); route(); toast('تم الإلغاء'); }
  } catch(err){ toast(err.message); }
}

function renderReq(){
  const I = S.I, me = S.bundle.me, td = today(), R = reqs(), myName = first(tName(me));
  $('#sub').textContent = 'الطلبات الواردة إليك، وطلباتك، والحصص المتفق عليها';
  const line = r => `${esc(I.C[r.c]||r.c)} · ${esc(I.S[r.s]||'')} · <b>${esc(reqWhen(r))}</b>${pTime(r.p) ? ' · ' + esc(pTime(r.p)) : ''}`;
  const inc = incoming();
  const acc = R.filter(r => r.status === 'accepted' && (r.from === me || r.by === me) && r.date >= td);
  const sent = R.filter(r => r.from === me && r.status === 'pending' && !started(r.date, r.p));
  const recent = R.filter(r => r.date >= td && ((r.from === me && ['declined','expired'].includes(r.status)) ||
    (r.status === 'cancelled' && r.by && (r.from === me || r.by === me) && r.cx !== me)));
  let h = '<h2>واردة إليك</h2>';
  h += inc.length ? inc.map(r => `<div class="card cand"><div class="row"><div class="nm">${esc(tName(r.from))}</div><span class="tag">${KIND[r.kind]}</span></div>
      <div class="why">${line(r)}${r.kind === 'swap' ? '<br>تبديل: تتفقان لاحقًا على موعد ردّ الحصة.' : ''}</div>
      <div class="acts"><button class="btn sm" data-acc="${r.id}">قبول</button><button class="btn ghost sm" data-dec="${r.id}">اعتذار</button>${waBtn(r.from, waMsg(r.from, {intro: `بخصوص طلب ${KIND[r.kind]} الحصة التالية:`, rows: reqLines(r), sign: false}))}</div></div>`).join('')
    : '<div class="muted small" style="padding:8px 0">لا توجد طلبات واردة</div>';
  h += '<h2>متفق عليها</h2>';
  h += acc.length ? acc.map(r => { const mineReq = r.from === me, other = mineReq ? r.by : r.from;
      return `<div class="card cand ${mineReq ? '' : 'mine'}"><div class="row"><div class="nm">${mineReq ? `أ. ${esc(first(tName(r.by)))} يؤمّن حصتك` : `تؤمّن حصة أ. ${esc(first(tName(r.from)))}`}</div><span class="tag o">${KIND[r.kind]}</span></div>
        <div class="why">${line(r)}</div><div class="acts">${waBtn(other, waMsg(other, {intro: `بخصوص ${KIND[r.kind]} الحصة التالية:`, rows: reqLines(r), sign: false}))}<button class="btn ghost sm" data-cx="${r.id}">إلغاء</button></div></div>`; }).join('')
    : '<div class="muted small" style="padding:8px 0">لا توجد حصص متفق عليها</div>';
  if (sent.length){
    h += '<h2>بانتظار الرد</h2>' + sent.map(r => { const dec = r.to.filter(x => x.r === 'declined').length;
      return `<div class="card cand"><div class="row"><div class="nm">${KIND[r.kind]} · ${esc(I.C[r.c]||r.c)}</div><span class="tag w">${r.to.length - dec} من ${r.to.length}</span></div>
        <div class="why">${line(r)}<br>${r.to.map(x => esc(first(tName(x.t))) + (x.r === 'declined' ? ' (اعتذر)' : '')).join('، ')}</div>
        <div class="acts"><button class="btn ghost sm" data-cx="${r.id}">سحب الطلب</button></div></div>`; }).join('');
  }
  if (recent.length){
    const st = r => r.status === 'declined' ? 'اعتذر الجميع' : r.status === 'expired' ? 'انتهى الوقت دون رد' : r.cx === 'admin' ? 'ألغاه المشرف' : `ألغاه أ. ${first(tName(r.cx))}`;
    h += '<h2>تحديثات</h2>' + recent.map(r => `<div class="card cand"><div class="row"><div class="nm">${KIND[r.kind]} · ${esc(I.C[r.c]||r.c)}</div><span class="tag g">${esc(st(r))}</span></div><div class="why">${line(r)}</div></div>`).join('');
  }
  $('#main').innerHTML = h;
  $('#main').onclick = async e => {
    const a = e.target.closest('[data-acc]'), d = e.target.closest('[data-dec]'), c = e.target.closest('[data-cx]');
    if (a || d){
      const id = +(a || d).dataset[a ? 'acc' : 'dec'], r = R.find(x => x.id === id);
      if (d && !confirm('هل تعتذر عن هذا الطلب؟')) return;
      (a || d).disabled = true;
      try {
        await rpc('respond_request', {p_token: S.token, p_id: id, p_accept: !!a}); await refresh(true); route();
        if (a){ const wa = waBtn(r.from, waMsg(r.from, {intro: `يسعدني إبلاغك بأنني قبلت ${KIND[r.kind]} الحصة التالية:`, rows: reqLines(r), outro: 'بالتوفيق إن شاء الله.'}), 'أبلغه عبر الواتساب');
          openSheet(`<div class="empty" style="padding:16px 0 8px"><b>تم القبول ✓</b><br>أُضيفت الحصة إلى «حصصي».</div>${wa.replace('btn wa sm','btn wa block')}<button class="btn ghost block" id="done" style="margin-top:10px">تم</button>`); $('#done').onclick = closeSheet; }
        else toast('تم');
      } catch(err){ toast(err.message); await refresh(true); route(); }
      return;
    }
    if (c){ const r = R.find(x => x.id === +c.dataset.cx); if (!r) return;
      const other = r.status === 'accepted' ? (r.from === me ? r.by : r.from) : null;
      cancelReq(r, other, other && waMsg(other, {intro: `أعتذر منك، فقد ألغيت ${KIND[r.kind]} الحصة التالية:`, rows: reqLines(r), outro: THANKS})); }
  };
}
async function copy(text){ try { await navigator.clipboard.writeText(text); toast('تم النسخ'); } catch(e){ prompt('انسخ الرسالة:', text); } }

function renderOpp(){
  const I = S.I, me = S.bundle.me, list = opportunities(I, S.bundle, me, today());
  $('#sub').textContent = 'زملاء لديهم مواعيد، وأنت متفرغ في حصصهم';
  const myName = first(tName(me));
  $('#main').innerHTML = list.length ? list.map(x => {
    const cls = I.C[x.c] || x.c, when = `${dayName(x.d)} ${fmtDate(x.date)} الحصة ${x.p}`;
    const msg = waMsg(x.owner, {intro: 'علمت أن لديك موعدًا، ويسعدني تأمين حصتك التالية:', rows: slotLines(x.date, x.p, cls), link: 'إن رغبت، أرسل لي الطلب في «بديل»:', outro: 'بالتوفيق إن شاء الله.'});
    const tags = x.meBehind ? '<span class="tag w">فرصة لمنهجك</span>' : x.teaches ? '<span class="tag o">تدرّس هذا الصف</span>' : '';
    return candCard(x.owner, `${esc(cls)} · ${esc(I.S[x.s]||'')} · <b>${esc(when)}</b>${x.flag.note ? ' · ' + esc(x.flag.note) : ''}`, msg, tags);
  }).join('') : '<div class="empty">لا توجد طلبات حاليًا</div>';
  $('#main').onclick = e => { const b = e.target.closest('[data-copy]'); if (b) copy(b.dataset.copy); };
}

function renderMe(){
  const I = S.I, me = S.bundle.me, t = I.T[me] || {};
  $('#sub').textContent = 'بياناتك تساعد زملاءك في الوصول إليك';
  const myClasses = [...new Set((I.byTeacher[me]||[]).map(x => x.c))].sort((a,b) => (I.C[a]||'').localeCompare(I.C[b]||'', 'ar', {numeric:true}));
  const behind = I.behind[me] || new Set();
  const appts = S.bundle.flags.filter(f => f.kind==='appointment' && f.teacher_id===me && f.on_date >= today()).sort((a,b) => a.on_date < b.on_date ? -1 : 1);
  $('#main').innerHTML = `
    <h2>متأخر في المنهج مع الصفوف</h2><div class="muted small">اختر الصفوف، وستظهر أولًا عندما يبحث زميل عن معلم لتأمين حصة مع هذا الصف.</div>
    <div class="chips wrapchips" id="beh">${myClasses.map(c => `<button class="chip ${behind.has(c)?'on':''}" data-c="${esc(c)}">${esc(I.C[c]||c)}</button>`).join('')}</div>
    <h2>مواعيدي</h2><div class="muted small">سيطّلع عليها زملاؤك في «مواعيد الزملاء» ويعرضون تأمين حصصك.</div>
    <div id="appts">${appts.map(f => `<div class="card cand"><div class="row"><div class="nm">${esc(dayName(dayOf(f.on_date)))} ${fmtDate(f.on_date)} · الحصة ${(f.periods||[]).join('، ')}</div><button class="btn ghost sm" data-del="${f.id}">حذف</button></div>${f.note?`<div class="why">${esc(f.note)}</div>`:''}</div>`).join('') || '<div class="muted small" style="padding:8px 0">لا توجد مواعيد</div>'}</div>
    <button class="btn ghost block" id="addAppt">+ موعد جديد</button>
    <h2>رقم الواتساب</h2><div style="display:flex;gap:8px"><input class="f" id="ph" inputmode="tel" dir="ltr" value="${esc(t.phone||'')}"><button class="btn" id="savePh">حفظ</button></div>
    <h2>الرمز السري</h2><div style="display:flex;gap:8px"><input class="f" id="po" inputmode="numeric" maxlength="4" type="password" placeholder="القديم"><input class="f" id="pn" inputmode="numeric" maxlength="4" type="password" placeholder="الجديد"><button class="btn" id="savePin">تغيير</button></div>
    <div style="margin:28px 0;text-align:center"><button class="linkbtn" id="out">تسجيل الخروج</button></div>`;
  $('#beh').onclick = async e => { const c = e.target.closest('.chip'); if (!c) return;
    try {
      if (behind.has(c.dataset.c)){ const f = S.bundle.flags.find(f => f.kind==='behind' && f.teacher_id===me && f.class_id===c.dataset.c); if (f) await rpc('delete_flag', {p_token:S.token, p_id:f.id}); }
      else await rpc('add_flag', {p_token:S.token, p_kind:'behind', p_class:c.dataset.c, p_date:null, p_periods:null, p_note:null});
      await refresh(true); renderMe();
    } catch(err){ toast(err.message); } };
  $('#appts').onclick = async e => { const b = e.target.closest('[data-del]'); if (!b) return; try { await rpc('delete_flag', {p_token:S.token, p_id:+b.dataset.del}); await refresh(true); renderMe(); } catch(err){ toast(err.message); } };
  $('#addAppt').onclick = apptSheet;
  $('#savePh').onclick = async () => { try { await rpc('update_phone', {p_token:S.token, p_phone:$('#ph').value}); await refresh(true); toast('تم الحفظ'); } catch(err){ toast(err.message); } };
  $('#savePin').onclick = async () => { try { await rpc('change_pin', {p_token:S.token, p_old:$('#po').value, p_new:$('#pn').value}); toast('تم تغيير الرمز'); $('#po').value = $('#pn').value = ''; } catch(err){ toast(err.message); } };
  $('#out').onclick = logout;
}

function apptSheet(){
  const I = S.I, me = S.bundle.me, dates = schoolDates(today(), 10);
  let date = dates[0], sel = new Set();
  const draw = () => {
    const d = dayOf(date), mine = (I.byTeacher[me]||[]).filter(x => x.d === d).sort((a,b) => a.p - b.p);
    openSheet(`<div style="font-weight:700;font-size:17px">موعد جديد</div>
      <label class="l">اليوم</label><div class="chips" id="ad">${dates.map(x => `<button class="chip ${x===date?'on':''}" data-d="${x}">${esc(dayName(dayOf(x)))}<span class="d">${fmtDate(x)}</span></button>`).join('')}</div>
      <label class="l">الحصص التي ستغيب عنها</label><div class="chips wrapchips" id="ap">${mine.map(l => `<button class="chip ${sel.has(l.p)?'on':''}" data-p="${l.p}">ح${l.p} · ${esc(I.C[l.c]||'')}</button>`).join('') || '<span class="muted small">لا توجد حصص في هذا اليوم</span>'}</div>
      <label class="l">ملاحظة (اختياري)</label><input class="f" id="an" maxlength="200" placeholder="مثلًا: موعد في المستشفى">
      <button class="btn block" id="as" style="margin-top:14px">حفظ</button>`);
    $('#ad').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; date = c.dataset.d; sel = new Set(); draw(); };
    $('#ap').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; const p = +c.dataset.p; sel.has(p) ? sel.delete(p) : sel.add(p); c.classList.toggle('on'); };
    $('#as').onclick = async () => { if (!sel.size) return toast('اختر حصة واحدة على الأقل');
      try { await rpc('add_flag', {p_token:S.token, p_kind:'appointment', p_class:null, p_date:date, p_periods:[...sel].sort(), p_note:$('#an').value||null}); await refresh(true); closeSheet(); renderMe(); toast('تم التسجيل'); }
      catch(err){ toast(err.message); } };
  };
  draw();
}

// ---------- Admin ----------
let PARSED = null;
function renderAdmin(){
  document.body.style.paddingBottom = '16px';
  const B = S.bundle;
  $('#app').innerHTML = `<div class="wrap"><header class="top"><h1>لوحة المشرف</h1><div class="sub">${B.teachers.length} معلم · ${B.classes.length} صف · ${B.schedule.length} حصة</div></header>
    <div class="card sec"><div style="font-weight:600">رفع الجدول (XML)</div><div class="muted small">ملف التصدير من برنامج الجداول. تبقى الرموز السرية وأرقام المعلمين كما هي.</div>
      <input type="file" id="xf" accept=".xml,text/xml" class="f" style="margin-top:10px"><div id="pv" class="small" style="margin-top:10px"></div>
      <button class="btn block hide" id="imp" style="margin-top:10px">اعتماد الجدول</button></div>
    <h2>سجل الطلبات</h2><div class="chips" id="lf"></div><div id="lg"></div>
    <h2>المعلمين</h2><input class="f" id="q" placeholder="ابحث…"><div class="card list" id="tl" style="margin-top:8px"></div>
    <div style="margin:28px 0;text-align:center"><button class="linkbtn" id="out">تسجيل الخروج</button></div></div>`;
  const draw = q => { $('#tl').innerHTML = B.teachers.filter(t => !q || norm(t.name).includes(norm(q))).sort((a,b) => a.name.localeCompare(b.name,'ar')).map(t =>
    `<div class="it"><span>${esc(t.name)} ${t.has_pin ? '<span class="tag o">مفعّل</span>' : '<span class="tag">غير مُفعَّل</span>'}</span>${t.has_pin ? `<button class="btn ghost sm" data-r="${esc(t.id)}">إعادة تعيين الرمز</button>` : ''}</div>`).join('') || '<div class="empty">ارفع الجدول أولًا</div>'; };
  draw(''); $('#q').oninput = e => draw(e.target.value.trim());
  drawLog();
  $('#tl').onclick = async e => { const b = e.target.closest('[data-r]'); if (!b) return; if (!confirm('هل تريد إعادة تعيين رمز هذا المعلم؟ سينشئ رمزًا جديدًا عند دخوله.')) return;
    try { await rpc('admin_reset_pin', {p_token:S.token, p_teacher:b.dataset.r}); await refresh(true); renderAdmin(); toast('تمت إعادة التعيين'); } catch(err){ toast(err.message); } };
  $('#xf').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      PARSED = parseTimetable(decodeXmlBytes(new Uint8Array(await f.arrayBuffer())));
      const bad = PARSED.teachers.filter(t => /\uFFFD/.test(t.name)).length;
      $('#pv').innerHTML = `${PARSED.teachers.length} معلم · ${PARSED.classes.length} صف · ${PARSED.subjects.length} مادة · ${PARSED.schedule.length} حصة<br>أمثلة: ${PARSED.teachers.slice(0,3).map(t => esc(t.name)).join('، ')}`
        + (bad ? `<div class="err">${bad} اسمًا يبدو تالفًا. تأكد من رفع الملف الأصلي.</div>` : '');
      $('#imp').classList.toggle('hide', !PARSED.schedule.length);
    } catch(err){ $('#pv').innerHTML = '<div class="err">تعذّرت قراءة الملف</div>'; }
  };
  $('#imp').onclick = async () => { if (!PARSED || !confirm('سيحلّ الجدول الجديد محلّ القديم. هل أنت متأكد؟')) return;
    try { const r = await rpc('admin_import', {p_token:S.token, p: PARSED}); await refresh(true); renderAdmin(); toast(`تم الاعتماد: ${r.teachers} معلمًا، ${r.lessons} حصة`); } catch(err){ toast(err.message); } };
  $('#out').onclick = logout;
}

let LOGF = 'accepted';
const ST = {pending:['بانتظار الرد','w'], accepted:['مقبول','o'], declined:['اعتذر الجميع','g'], cancelled:['ملغى','g'], expired:['انتهى دون رد','g']};
function drawLog(){
  const I = S.I, td = today(), all = reqs().slice().sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.p - a.p);
  const F = {accepted:'مقبولة', pending:'معلّقة', cancelled:'ملغاة', all:'الكل'};
  $('#lf').innerHTML = Object.entries(F).map(([k,v]) => `<button class="chip ${LOGF===k?'on':''}" data-f="${k}">${v} (${k==='all' ? all.length : all.filter(r => r.status===k).length})</button>`).join('');
  const rows = all.filter(r => LOGF === 'all' || r.status === LOGF).slice(0, 150);
  $('#lg').innerHTML = rows.map(r => `<div class="card cand"><div class="row"><div class="nm">${esc(first(tName(r.from)))} ← ${r.by ? esc(first(tName(r.by))) : '—'}</div><span class="tag ${ST[r.status][1]}">${KIND[r.kind]} · ${ST[r.status][0]}</span></div>
    <div class="why">${esc(I.C[r.c]||r.c)} · ${esc(I.S[r.s]||'')} · ${esc(reqWhen(r))}${r.status==='cancelled' && r.cx ? ' · ألغاه ' + (r.cx==='admin' ? 'المشرف' : esc(first(tName(r.cx)))) : ''}</div>
    ${['pending','accepted'].includes(r.status) && r.date >= td ? `<div class="acts"><button class="btn ghost sm" data-cx="${r.id}">إلغاء</button></div>` : ''}</div>`).join('') || '<div class="muted small" style="padding:8px 0">لا يوجد</div>';
  $('#lf').onclick = e => { const c = e.target.closest('.chip'); if (c){ LOGF = c.dataset.f; drawLog(); } };
  $('#lg').onclick = async e => { const b = e.target.closest('[data-cx]'); if (!b || !confirm('إلغاء هذا الطلب؟')) return;
    try { await rpc('cancel_request', {p_token:S.token, p_id:+b.dataset.cx}); await refresh(true); drawLog(); toast('تم الإلغاء'); } catch(err){ toast(err.message); } };
}

// تحديث تلقائي للطلبات
let LASTREQ = '';
async function poll(){
  if (!S.token || !S.bundle || document.hidden) return;
  await refresh(true);
  const sig = JSON.stringify(reqs());
  if (sig !== LASTREQ){ LASTREQ = sig; if (!$('#sheet').classList.contains('open') && !S.bundle.is_admin) route(); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
setInterval(poll, 90000);

// ---------- Boot ----------
(async () => {
  if (S.token && S.bundle){ S.I = buildIndex(S.bundle); route(); refresh(true).then(() => { if (S.token && S.bundle && !$('#sheet').classList.contains('open')) route(); }); }
  else if (S.token){ await refresh(); route(); }
  else renderLogin();
})();
</script>

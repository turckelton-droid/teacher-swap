# بينادي قاعدة البيانات كل 3 أيام عشان Supabase المجاني ماينامش في الإجازات
name: keepalive
on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping supabase
        run: |
          KEY=$(curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/index.html | grep -o "SB_KEY = '[^']*'" | cut -d"'" -f2)
          curl -sf -X POST "https://elgeadktiazterzwaxyn.supabase.co/rest/v1/rpc/list_teachers" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' -o /dev/null -w "%{http_code}\n"
